[project]
name = "solid-state-ionics-interactives"
version = "0.6.0"
description = "Interactive teaching materials for a Solid State Ionics course"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.23.14",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"
