name: Deploy marimo apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build the course landing page and redirects
        run: |
          mkdir -p _site
          cp pages/index.html _site/index.html
          cp -r pages/01-brouwer-sto _site/01-brouwer-sto

      - name: Check both marimo notebooks
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo check --strict
          01_defect_formation.py 02_brouwer_sto.py

      - name: Export Module 01 - defect formation thermodynamics
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo export html-wasm 01_defect_formation.py
          -o _site/01-defect-formation
          --mode run --no-show-code --no-execute -f

      - name: Export Module 02 - Brouwer diagram
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo export html-wasm 02_brouwer_sto.py
          -o _site/02-brouwer-sto
          --mode run --no-show-code --no-execute -f

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
