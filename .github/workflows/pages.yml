name: Deploy marimo apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build the course landing page
        run: |
          mkdir -p _site
          cp pages/index.html _site/index.html

      - name: Check all five marimo notebooks
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo check --strict
          01_defect_formation.py 02_brouwer_sto.py 03_defect_transport.py 04_space_charge_frumkin.py 05_stoichiometry_polarization.py

      - name: Export Module 01 - defect formation thermodynamics
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo export html-wasm 01_defect_formation.py
          -o _site/01-defect-formation
          --mode run --no-show-code --no-execute -f

      - name: Export Module 02 - Brouwer diagram
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo export html-wasm 02_brouwer_sto.py
          -o _site/02-brouwer-sto
          --mode run --no-show-code --no-execute -f

      - name: Export Module 03 - defect transport
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo export html-wasm 03_defect_transport.py
          -o _site/03-defect-transport
          --mode run --no-show-code --no-execute -f

      - name: Export Module 04 - space-charge layers and Frumkin effect
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo export html-wasm 04_space_charge_frumkin.py
          -o _site/04-space-charge-frumkin
          --mode run --no-show-code --no-execute -f

      - name: Export Module 05 - stoichiometry polarization
        run: >-
          uv run --isolated --with "marimo==0.24.0"
          marimo export html-wasm 05_stoichiometry_polarization.py
          -o _site/05-stoichiometry-polarization
          --mode run --no-show-code --no-execute -f

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify all deployed WASM entry modules
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Fetch all app entry points and dynamic run-page modules
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail

          for route in 01-defect-formation 02-brouwer-sto 03-defect-transport 04-space-charge-frumkin 05-stoichiometry-polarization; do
            module_url="${SITE_URL%/}/${route}/"
            html="$(curl --fail --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "$module_url")"

            entry_asset="$(grep -oE \
              'assets/index-[A-Za-z0-9_-]+\.js' \
              <<< "$html" | sed -n '1p')"
            test -n "$entry_asset"

            entry_js="$(curl --fail --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${module_url}${entry_asset}")"
            run_page_asset="$(grep -oE \
              '\./run-page-[A-Za-z0-9_-]+\.js' \
              <<< "$entry_js" | sed -n '1p' | sed 's#^\./##')"
            test -n "$run_page_asset"

            curl --fail --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${module_url}assets/${run_page_asset}" >/dev/null
            echo "Verified ${route}: ${entry_asset} -> assets/${run_page_asset}"
          done
